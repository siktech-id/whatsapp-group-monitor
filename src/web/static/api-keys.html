<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Keys &middot; {{PROJECT_NAME}}</title>
  <meta name="csrf-token" content="{{CSRF_TOKEN}}" />
  <link rel="stylesheet" href="/static/shared.css" />
  <style>
    .content { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    .back { color: #667781; text-decoration: none; font-size: 0.85rem; }
    .back:hover { text-decoration: underline; }
    .box {
      background: white;
      padding: 1.5rem 2rem;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      margin: 1rem 0;
    }
    h2 { color: #1a1a1a; font-size: 1.1rem; margin: 0 0 1rem; }
    .hint { color: #667781; font-size: 0.85rem; margin: -0.5rem 0 1rem; }
    label { color: #667781; font-size: 0.85rem; }
    .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
    input[type=text] {
      flex: 1 1 220px;
      padding: 0.6rem 0.8rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }
    input[type=text]:focus { border-color: #25d366; }
    .scopes { display: flex; gap: 1rem; }
    .scopes label { color: #1a1a1a; display: flex; gap: 0.3rem; align-items: center; }
    .btn {
      padding: 0.6rem 1.2rem;
      background: #25d366;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn:hover { background: #1da851; }
    .btn-danger { background: none; color: #e74c3c; border: 1px solid #e74c3c; padding: 0.3rem 0.7rem; font-size: 0.8rem; }
    .btn-danger:hover { background: #fdf0f0; }
    .msg { font-size: 0.85rem; margin: 0.75rem 0 0; min-height: 1em; }
    .msg-ok { color: #25d366; }
    .msg-err { color: #e74c3c; }
    .new-key { display: none; background: #fffbe6; border: 1px solid #f0d060; }
    .new-key code {
      display: block;
      word-break: break-all;
      background: white;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.6rem;
      margin: 0.5rem 0;
      font-size: 0.9rem;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; color: #667781; font-weight: 500; padding: 0.5rem; border-bottom: 1px solid #eee; white-space: nowrap; }
    td { padding: 0.5rem; border-bottom: 1px solid #f3f3f3; vertical-align: middle; }
    tr.revoked td { color: #aaa; }
    .tag { display: inline-block; background: #f0f2f5; border-radius: 4px; padding: 0.1rem 0.4rem; margin-right: 0.25rem; font-size: 0.8rem; }
    .empty { color: #667781; font-size: 0.9rem; }
  </style>
</head>
<body>
  {{> header}}
  <div class="content">
    {{> status-bar}}
    <a class="back" href="/" id="back-link">&larr; Back to groups</a>

    <div class="box">
      <h2>Create API key</h2>
      <p class="hint">One key per client platform. Send it in the <code>x-api-key</code> header.</p>
      <form id="create-form" onsubmit="createKey(event)">
        <div class="row">
          <input type="text" id="name" placeholder="Client name (e.g. crm-platform)" maxlength="64" required />
          <div class="scopes">
            <label><input type="checkbox" name="scope" value="read" checked /> read</label>
            <label><input type="checkbox" name="scope" value="send" /> send</label>
            <label><input type="checkbox" name="scope" value="settings" /> settings</label>
          </div>
          <button type="submit" class="btn">Create</button>
        </div>
        <p class="msg" id="msg"></p>
      </form>
    </div>

    <div class="box new-key" id="new-key-box">
      <h2>New key for <span id="new-key-name"></span></h2>
      <p class="hint" style="margin:0">Copy it now. It won't be shown again.</p>
      <code id="new-key-value"></code>
      <button class="btn" onclick="copyKey()">Copy</button>
      <button class="btn" style="background:#667781" onclick="hideNewKey()">Done</button>
    </div>

    <div class="box">
      <h2>Clients</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Key</th><th>Scopes</th><th>Created</th><th>Last used</th><th>Status</th><th></th></tr>
          </thead>
          <tbody id="clients"></tbody>
        </table>
      </div>
      <p class="empty" id="empty" style="display:none">No API keys yet.</p>
    </div>
  </div>
  <script>
    const csrf = document.querySelector('meta[name="csrf-token"]').content;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function fmt(d) { return d ? new Date(d).toLocaleString() : '—'; }

    async function load() {
      const res = await fetch('/api/api-keys');
      if (res.status === 401) { window.location.href = '/login'; return; }
      const { clients } = await res.json();
      const tbody = document.getElementById('clients');
      document.getElementById('empty').style.display = clients.length ? 'none' : '';
      tbody.innerHTML = clients.map(c => {
        const revoked = !!c.revokedAt;
        return '<tr class="' + (revoked ? 'revoked' : '') + '">' +
          '<td>' + esc(c.name) + '</td>' +
          '<td><code>' + esc(c.keyPrefix) + '…</code></td>' +
          '<td>' + c.scopes.map(s => '<span class="tag">' + esc(s) + '</span>').join('') + '</td>' +
          '<td>' + fmt(c.createdAt) + '</td>' +
          '<td>' + fmt(c.lastUsedAt) + '</td>' +
          '<td>' + (revoked ? 'Revoked ' + fmt(c.revokedAt) : 'Active') + '</td>' +
          '<td>' + (revoked ? '' : '<button class="btn btn-danger" data-revoke-id="' + c.id + '" data-revoke-name="' + esc(c.name) + '">Revoke</button>') + '</td>' +
          '</tr>';
      }).join('');
    }

    async function createKey(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const scopes = [...document.querySelectorAll('input[name=scope]:checked')].map(i => i.value);
      if (!scopes.length) { showMsg('Select at least one scope', false); return; }
      try {
        const res = await fetch('/api/api-keys', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-csrf-token': csrf },
          body: JSON.stringify({ name, scopes }),
        });
        const data = await res.json();
        if (!res.ok) { showMsg(data.error || 'Failed to create key', false); return; }
        document.getElementById('new-key-name').textContent = data.client.name;
        document.getElementById('new-key-value').textContent = data.key;
        document.getElementById('new-key-box').style.display = 'block';
        document.getElementById('create-form').reset();
        showMsg('Key created', true);
        load();
      } catch {
        showMsg('Failed to create key', false);
      }
    }

    async function revokeKey(id, name) {
      if (!confirm('Revoke the key for "' + name + '"? Requests using it will fail immediately.')) return;
      const res = await fetch('/api/api-keys/' + id, { method: 'DELETE', headers: { 'x-csrf-token': csrf } });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        alert(data.error || 'Failed to revoke');
      }
      load();
    }

    document.getElementById('clients').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-revoke-id]');
      if (btn) revokeKey(btn.dataset.revokeId, btn.dataset.revokeName);
    });

    async function copyKey() {
      const value = document.getElementById('new-key-value').textContent;
      try { await navigator.clipboard.writeText(value); showMsg('Copied to clipboard', true); }
      catch { showMsg('Copy failed. Select the key and copy it manually.', false); }
    }

    function hideNewKey() {
      document.getElementById('new-key-value').textContent = '';
      document.getElementById('new-key-box').style.display = 'none';
    }

    function showMsg(text, ok) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
      setTimeout(() => { el.textContent = ''; }, 3000);
    }

    document.addEventListener('statusbar:state', (e) => {
      if (e.detail !== 'open') document.getElementById('back-link').textContent = '← Back';
    });

    load();
  </script>
</body>
</html>
